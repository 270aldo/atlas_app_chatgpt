name: CI

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -w typecheck

      - name: Lint
        run: pnpm -w lint

      - name: Format check
        run: pnpm -w format:check

      - name: Test
        run: pnpm -w test

      - name: Build widgets
        run: pnpm --filter @atlas/widgets build

      - name: Build MCP server
        run: pnpm --filter @atlas/mcp-node build

      - name: Check build artifacts
        run: |
          test -d packages/widgets/dist || exit 1
          test -d packages/mcp-node/dist || exit 1
          echo "✅ Build artifacts verified"
